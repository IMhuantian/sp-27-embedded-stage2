# ---------- 选择烧录器 ----------
# source [find interface/stlink.cfg]
source [find interface/cmsis-dap.cfg]
# ATK-HS-V3-CMSIS-DAP: use its Windows HID interface explicitly.
# Avoid auto-selecting a USB bulk interface that fails CMD_INFO.
cmsis-dap backend hid
cmsis-dap vid_pid 0x04d8 0x00df
transport select swd

# ---------- 选择芯片型号 ----------
source [find target/stm32f4x.cfg]
# source [find target/stm32H7x.cfg]

# ---------- SWD 时钟频率（kHz） ----------
# 认不到芯片时调小
adapter speed 500
